name: Build FRIDAY APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: platform-tools

  - name: Install Android SDK Components
    run: |
      sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      yes | sdkmanager --licenses

  - name: Verify Android SDK
    run: |
      sdkmanager --list_installed
      echo "ANDROID_HOME=$ANDROID_HOME"
      test -d "$ANDROID_HOME/platforms/android-35"
      test -d "$ANDROID_HOME/build-tools/35.0.0"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Run Unit Tests
    working-directory: android
    run: gradle testDebugUnitTest --no-daemon --stacktrace

  - name: Build FRIDAY APK
    working-directory: android
    run: gradle assembleDebug --no-daemon --stacktrace

  - name: Verify APK
    working-directory: android
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"
      if [ ! -f "$APK" ]; then
        echo "APK was not generated!"
        exit 1
      fi
      ls -lh "$APK"
      "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

  - name: Upload FRIDAY APK
    uses: actions/upload-artifact@v4
    with:
      name: FRIDAY-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error

  - name: Upload Test Reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: FRIDAY-Test-Reports
      path: android/app/build/reports/tests/testDebugUnitTest/
      if-no-files-found: ignore
