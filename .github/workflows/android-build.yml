name: Build FRIDAY APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK packages
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Run Unit Tests
      - name: Run Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # 7. Build APK
      - name: Build FRIDAY APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # 8. Verify APK
      - name: Verify APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      # 9. Upload APK
      - name: Upload FRIDAY APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Upload Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Test-Reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
